<!DOCTYPE html>
<html lang="en" data-i18n-title="popup.header">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="Popup">
    <!-- PIN Lock Screen -->
    <div id="pin-lock" class="PinLock" style="display: none;">
        <div class="PinLock__Icon">🔒</div>
        <h3 class="PinLock__Title" data-i18n="pin.title">Enter PIN</h3>
        <div class="PinDigits PinDigits_lock" id="pin-lock-digits" role="group" aria-label="PIN code input">
            <input type="password" class="PinDigits__Input" maxlength="1" inputmode="numeric" aria-label="PIN digit 1">
            <input type="password" class="PinDigits__Input" maxlength="1" inputmode="numeric" aria-label="PIN digit 2">
            <input type="password" class="PinDigits__Input" maxlength="1" inputmode="numeric" aria-label="PIN digit 3">
            <input type="password" class="PinDigits__Input" maxlength="1" inputmode="numeric" aria-label="PIN digit 4">
        </div>
        <p id="pin-error" class="PinLock__Error" role="alert" style="display: none;" data-i18n="pin.error">Incorrect PIN</p>
        <p id="pin-attempts" class="PinLock__Attempts" aria-live="polite" style="display: none;"></p>
        <button id="pin-reset-btn" class="PinLock__ResetBtn" style="display: none;" data-i18n="pin.forgot">Forgot PIN?
            Reset all data</button>
    </div>

    <!-- Main Content -->
    <div id="main-content">
        <h1 class="Popup__Header">
            <img src="icons/icon48.png" alt="" class="Popup__HeaderIcon">
            <span data-i18n="popup.header">Thai TM30 Helper</span>
        </h1>
        <div id="person-list" class="Popup__PersonList">
            <!-- List will be injected here -->
        </div>
        <div class="Popup__Footer">
            <button id="open-options" class="Popup__BtnManage" data-i18n="popup.settings">Settings</button>
        </div>
        <div class="Popup__BottomFooter">
            <div class="Popup__FooterGroup">
                <button id="leave-review" class="Popup__FooterLink" type="button" data-i18n="popup.leaveReview">⭐ Leave a review</button>
                <button id="buy-coffee" class="Popup__FooterLink" type="button" data-i18n="popup.buyCoffee">☕ Buy me a coffee</button>
            </div>
            <span class="Popup__FooterBrand"><span data-i18n="popup.madeBy">Made by</span> <a href="https://lirik.pro/en" id="author-link" class="Popup__FooterAuthor">lirik</a> 💚</span>
        </div>
    </div>

    <script type="module" src="scripts/popup/index.js"></script>
</body>

</html>
